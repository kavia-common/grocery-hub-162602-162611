spring.application.name=grocerybackend

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Security/JWT Configuration
# In production, override these with secure values via environment variables
app.security.jwt.secret=${JWT_SECRET:PaAQWy2iXZ4DmxUNkPXhjMn9VgKb3RcL8fJtSvH5}
app.security.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
